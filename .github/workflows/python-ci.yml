# Lint, format, and test singlestore-pulse on every PR and push to master.
name: Python CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-path: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Lint check
        run: make lint-check
      - name: Format check
        run: make format-check
      - name: Test
        run: make test
